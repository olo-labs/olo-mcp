name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-server:
    name: Test MCP server
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  test-agent:
    name: Test LangGraph console agent
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/langgraph-console-agent/requirements-dev.txt

      - name: Create isolated agent environment
        run: python -m venv examples/langgraph-console-agent/.venv

      - name: Install agent dependencies
        run: examples/langgraph-console-agent/.venv/bin/python -m pip install -r examples/langgraph-console-agent/requirements-dev.txt

      - name: Build MCP integration image
        run: docker build --tag simple-mcp-server:integration .

      - name: Start MCP integration container
        run: docker run --detach --name simple-mcp-integration --publish 8000:8000 simple-mcp-server:integration

      - name: Wait for MCP health check
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs simple-mcp-integration
          exit 1

      - name: Run agent tests
        working-directory: examples/langgraph-console-agent
        env:
          RUN_MCP_DOCKER_INTEGRATION: "1"
        run: .venv/bin/python -m pytest

      - name: Show MCP logs on failure
        if: failure()
        run: docker logs simple-mcp-integration || true

      - name: Stop MCP integration container
        if: always()
        run: docker rm --force simple-mcp-integration || true

  publish:
    name: Build, publish, and release
    needs:
      - test-server
      - test-agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE_NAME: "${{ secrets.DOCKERHUB_USERNAME }}/simple-mcp-server"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: "${{ env.IMAGE_NAME }}"
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Package release assets
        id: release
        shell: bash
        env:
          IMAGE_TAGS: "${{ steps.meta.outputs.tags }}"
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_title="Release $GITHUB_REF_NAME"
          else
            release_tag="build-${GITHUB_SHA::7}"
            release_title="Build ${GITHUB_SHA::7}"
          fi

          archive="simple-mcp-server-${release_tag}.tar.gz"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="simple-mcp-server-${release_tag}/" \
            --output="dist/${archive}" \
            "$GITHUB_SHA"
          (cd dist && sha256sum "$archive" > SHA256SUMS.txt)

          {
            echo "tag=$release_tag"
            echo "title=$release_title"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"

          {
            echo "The Docker image was built and pushed successfully."
            echo
            echo "Published image tags:"
            while IFS= read -r image_tag; do
              [[ -n "$image_tag" ]] && echo "- \`$image_tag\`"
            done <<< "$IMAGE_TAGS"
            echo
            echo "The source archive and SHA-256 checksum are attached."
          } > release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ steps.release.outputs.tag }}"
          RELEASE_TITLE: "${{ steps.release.outputs.title }}"
          RELEASE_ARCHIVE: "${{ steps.release.outputs.archive }}"
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload \
              "$RELEASE_TAG" \
              "dist/$RELEASE_ARCHIVE" \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit \
              "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create \
              "$RELEASE_TAG" \
              "dist/$RELEASE_ARCHIVE" \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi
